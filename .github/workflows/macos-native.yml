name: macOS Native App

on:
  push:
    paths:
      - 'macos/**'
      - '.github/workflows/macos-native.yml'
  pull_request:
    paths:
      - 'macos/**'
      - '.github/workflows/macos-native.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & test (macOS)
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Design harness and tokens
        run: bash scripts/check-design-docs.sh

      - name: Brand assets up to date
        run: python3 -I design/brand/make_brand_assets.py --check

      - name: Bundled sounds match their rights ledger
        run: python3 -I scripts/sounds/check-ledger.py

      - name: GraphiumCore and MCP server unit tests
        run: swift test --parallel

      - name: Unit tests under Thread Sanitizer
        run: swift test --sanitize=thread --filter 'GraphiumCoreTests|GraphiumMCPTests'

      - name: MCP server builds and answers over stdio
        run: |
          swift build -c release --product graphium-mcp
          BIN="$(swift build -c release --product graphium-mcp --show-bin-path)/graphium-mcp"
          mkdir -p "$RUNNER_TEMP/campaigns"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"create_campaign","arguments":{"path":"CI","name":"CI"}}}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"add_rooms","arguments":{"campaign":"CI","rooms":[{"x":1,"y":1,"width":5,"height":4,"doors":[{"side":"east"}]}]}}}' \
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"check_map","arguments":{"campaign":"CI"}}}' \
            | "$BIN" --root "$RUNNER_TEMP/campaigns" | tee mcp-out.jsonl
          test "$(wc -l < mcp-out.jsonl)" -eq 4
          ! grep -q '"isError":true' mcp-out.jsonl
          test -f "$RUNNER_TEMP/campaigns/CI.graphiumcampaign/campaign.json"

      - name: Save fault checks (concurrent writers, kill mid-save, full disk)
        run: bash scripts/save-fault-checks.sh "$(swift build -c release --product graphium-mcp --show-bin-path)/graphium-mcp"

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd App && xcodegen generate

      - name: Build app (ad-hoc signed so it launches on Apple Silicon)
        run: |
          xcodebuild build \
            -project App/Graphium.xcodeproj \
            -scheme Graphium \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            -quiet \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=

      - name: Check bundle declares the document type
        run: |
          APP=DerivedData/Build/Products/Release/Graphium.app
          plutil -extract UTExportedTypeDeclarations.0.UTTypeIdentifier raw "$APP/Contents/Info.plist" \
            | grep -qx com.graphium.campaign-package
          codesign --verify --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/Graphium"

      - name: Check the Quick Look and Spotlight extensions are embedded
        run: |
          PLUGINS=DerivedData/Build/Products/Release/Graphium.app/Contents/PlugIns
          for ext in GraphiumThumbnail:com.apple.quicklook.thumbnail GraphiumPreview:com.apple.quicklook.preview \
            GraphiumSpotlight:com.apple.spotlight.import; do
            APPEX="$PLUGINS/${ext%%:*}.appex"
            codesign --verify --verbose=2 "$APPEX"
            plutil -extract NSExtension.NSExtensionPointIdentifier raw "$APPEX/Contents/Info.plist" | grep -qx "${ext#*:}"
            plutil -p "$APPEX/Contents/Info.plist" | grep com.graphium.campaign-package >/dev/null
          done

      - name: Check the bundled MCP server answers
        run: |
          MCP=DerivedData/Build/Products/Release/Graphium.app/Contents/MacOS/graphium-mcp
          codesign --verify --verbose=2 "$MCP"
          lipo -archs "$MCP"
          "$MCP" --version
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | "$MCP" --root "$RUNNER_TEMP" | tee bundled-mcp.jsonl
          test "$(wc -l < bundled-mcp.jsonl)" -eq 2
          grep -q '"add_rooms"' bundled-mcp.jsonl

      - name: Package app
        run: ditto -c -k --keepParent DerivedData/Build/Products/Release/Graphium.app Graphium-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Graphium-macOS
          path: macos/Graphium-macOS.zip
          retention-days: 14

  # Launch-QA persona runs (macos/docs/qa/LAUNCH_QA.md): scripted XCUITest sessions on the real
  # app. A stall is a finding, not a failure, so this job is informational; its artifact holds
  # the traces, screenshots, accessibility audits, the app's log and a network check.
  persona-ui:
    name: Launch QA personas (macOS)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project and fixtures
        run: |
          brew install xcodegen
          (cd App && xcodegen generate)
          swift scripts/qa/make-fixtures.swift "$RUNNER_TEMP/qa-fixtures"
          mkdir -p "$RUNNER_TEMP/qa-out"

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project App/Graphium.xcodeproj -scheme Graphium -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath DerivedData -quiet \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=

      - name: Network on launch (should be none)
        run: |
          APP=DerivedData/Build/Products/Debug/Graphium.app
          "$APP/Contents/MacOS/Graphium" -ApplePersistenceIgnoreState YES > /dev/null 2>&1 &
          PID=$!
          sleep 15
          {
            echo "Sockets held by Graphium 15 s after launch (lsof -i):"
            lsof -a -i -p "$PID" || echo "(none)"
          } | tee "$RUNNER_TEMP/qa-out/network-on-launch.txt"
          kill "$PID" || true
          sleep 2

      - name: Persona runs
        continue-on-error: true
        env:
          TEST_RUNNER_QA_FIXTURES: ${{ runner.temp }}/qa-fixtures
          TEST_RUNNER_QA_OUT: ${{ runner.temp }}/qa-out
        run: |
          defaults write -g AppleKeyboardUIMode -int 2
          xcodebuild test-without-building \
            -project App/Graphium.xcodeproj -scheme Graphium -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath DerivedData \
            -resultBundlePath "$RUNNER_TEMP/qa-out/personas.xcresult" \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= 2>&1 | tail -80

      - name: Collect traces, logs and crash reports
        if: always()
        run: |
          OUT="$RUNNER_TEMP/qa-out"
          mkdir -p "$OUT/attachments"
          xcrun xcresulttool export attachments --path "$OUT/personas.xcresult" --output-path "$OUT/attachments" || true
          cp ~/Library/Logs/Graphium/*.log "$OUT/" 2>/dev/null || true
          ls ~/Library/Logs/DiagnosticReports/ | grep -i graphium > "$OUT/crash-reports.txt" || echo "none" > "$OUT/crash-reports.txt"
          cp ~/Library/Logs/DiagnosticReports/Graphium* "$OUT/" 2>/dev/null || true
          {
            echo "error and fault lines in the app log:"
            grep -hE '\[(error|fault)\]' "$OUT"/*.log || echo "(none)"
          } > "$OUT/log-errors.txt"
          cat "$OUT/crash-reports.txt" "$OUT/log-errors.txt"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-qa-personas
          path: ${{ runner.temp }}/qa-out
          retention-days: 14
