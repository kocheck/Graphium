name: Documentation Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  pull-requests: write
  contents: read

# GitHub Models (models.inference.ai.azure.com / models.github.ai) was retired on
# 2026-07-30. This workflow no longer calls that API. Prefer the rule-based
# Documentation Check (Simple) workflow for actionable review prompts.
jobs:
  check-documentation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Summarize documentation review status
        id: summary
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff --name-only origin/${{ github.base_ref }}...${{ github.sha }} > changed_files.txt

          {
            echo '## Documentation Check'
            echo
            echo '**Status:** AI analysis unavailable'
            echo
            echo 'GitHub Models was retired on 2026-07-30, so this workflow no longer calls the inference API.'
            echo 'Use **Documentation Check (Simple)** for rule-based suggestions, and update docs when the PR changes IPC, Electron security, sync, or public utilities.'
            echo
            echo '### Changed files in this PR'
            echo
            sed 's/^/- /' changed_files.txt | head -n 80
            if [ "$(wc -l < changed_files.txt)" -gt 80 ]; then
              echo
              echo "_…and $(( $(wc -l < changed_files.txt) - 80 )) more files._"
            fi
            echo
            echo '### Suggested review targets'
            echo
            echo '- `docs/architecture/IPC_API.md` — IPC / sync action changes'
            echo '- `electron/README.md` — main-process / media protocol / path security'
            echo '- `src/utils/README.md` — new or renamed shared helpers'
            echo '- `.cursorrules` — assistant quick-reference patterns'
            echo
            echo '**Documentation Impact**: Low'
            echo
            echo '<sub>Successor of the retired GitHub Models documentation analyzer • See [documentation-check-simple.yml](.github/workflows/documentation-check-simple.yml)</sub>'
          } > analysis_result.md

          echo "needs_update=false" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const analysis = fs.readFileSync('analysis_result.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: analysis,
            });
