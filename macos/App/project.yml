# XcodeGen spec for the Graphium macOS app. Generate the project with:
#   cd macos/App && xcodegen generate && open Graphium.xcodeproj
# Graphium.xcodeproj is generated and not committed.
name: Graphium
options:
  bundleIdPrefix: com.graphium
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  GraphiumCore:
    path: ..
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Graphium:
    type: application
    platform: macOS
    sources: [Graphium]
    dependencies:
      - package: GraphiumCore
      - package: GraphiumCore
        product: GraphiumRender
      - package: GraphiumCore
        product: GraphiumMCP
      # The MCP server ships inside the app as Contents/MacOS/graphium-mcp (docs/MCP.md).
      - target: MCPServer
        embed: true
        codeSign: true
        copy:
          destination: executables
      # Finder thumbnails, Quick Look previews and Spotlight search for campaigns, in Contents/PlugIns.
      - target: QuickLookThumbnail
        embed: true
        codeSign: true
      - target: QuickLookPreview
        embed: true
        codeSign: true
      - target: SpotlightImporter
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.graphium.mac
        PRODUCT_NAME: Graphium
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Graphium/Graphium.entitlements
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:   # Debug builds show the amber dev icon; Release the Paper icon (design/brand/make_brand_assets.py)
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDev
        Release:
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Graphium/Graphium.entitlements
      properties:
        com.apple.security.app-sandbox: false
    info:
      path: Graphium/Info.plist
      properties:
        CFBundleDisplayName: Graphium
        LSApplicationCategoryType: public.app-category.role-playing-games
        NSHumanReadableCopyright: MIT License
        CFBundleDocumentTypes:
          - CFBundleTypeName: Graphium Campaign
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes: [com.graphium.campaign-package]
          - CFBundleTypeName: Graphium Campaign (Legacy)
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.graphium.campaign]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.graphium.campaign-package
            UTTypeDescription: Graphium Campaign
            UTTypeConformsTo: [com.apple.package, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [graphiumcampaign]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.graphium.campaign
            UTTypeDescription: Graphium Campaign (Legacy)
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [graphium]
  # graphium-mcp, built from the same sources as the package's executable.
  MCPServer:
    type: tool
    platform: macOS
    sources: [../Sources/graphium-mcp]
    dependencies:
      - package: GraphiumCore
        product: GraphiumMCP
    settings:
      base:
        PRODUCT_NAME: graphium-mcp
        PRODUCT_BUNDLE_IDENTIFIER: com.graphium.mcp
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  # Quick Look and Spotlight for .graphiumcampaign packages (README, "Campaigns in Finder").
  # Each is sandboxed and reads only the package it is handed; nothing touches the network.
  QuickLookThumbnail:
    type: app-extension
    platform: macOS
    sources: [QuickLookThumbnail]
    dependencies:
      - package: GraphiumCore
      - package: GraphiumCore
        product: GraphiumRender
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.graphium.mac.thumbnail
        PRODUCT_NAME: GraphiumThumbnail
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: QuickLookThumbnail/QuickLookThumbnail.entitlements
        SKIP_INSTALL: YES
    entitlements:
      path: QuickLookThumbnail/QuickLookThumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: QuickLookThumbnail/Info.plist
      properties:
        CFBundleDisplayName: Graphium Thumbnails
        NSHumanReadableCopyright: MIT License
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ThumbnailProvider"
          NSExtensionAttributes:
            QLSupportedContentTypes: [com.graphium.campaign-package]
            QLThumbnailMinimumDimension: 0
  QuickLookPreview:
    type: app-extension
    platform: macOS
    sources: [QuickLookPreview]
    dependencies:
      - package: GraphiumCore
      - package: GraphiumCore
        product: GraphiumRender
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.graphium.mac.preview
        PRODUCT_NAME: GraphiumPreview
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: QuickLookPreview/QuickLookPreview.entitlements
        SKIP_INSTALL: YES
    entitlements:
      path: QuickLookPreview/QuickLookPreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: QuickLookPreview/Info.plist
      properties:
        CFBundleDisplayName: Graphium Previews
        NSHumanReadableCopyright: MIT License
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).PreviewProvider"
          NSExtensionAttributes:
            QLIsDataBasedPreview: true
            QLSupportsSearchableItems: false
            QLSupportedContentTypes: [com.graphium.campaign-package]
  SpotlightImporter:
    type: app-extension
    platform: macOS
    sources: [SpotlightImporter]
    dependencies:
      - package: GraphiumCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.graphium.mac.spotlight
        PRODUCT_NAME: GraphiumSpotlight
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: SpotlightImporter/SpotlightImporter.entitlements
        SKIP_INSTALL: YES
    entitlements:
      path: SpotlightImporter/SpotlightImporter.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: SpotlightImporter/Info.plist
      properties:
        CFBundleDisplayName: Graphium Spotlight
        NSHumanReadableCopyright: MIT License
        NSExtension:
          NSExtensionPointIdentifier: com.apple.spotlight.import
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ImportExtension"
          NSExtensionAttributes:
            CSSupportedContentTypes: [com.graphium.campaign-package]
schemes:
  Graphium:
    build:
      targets:
        Graphium: all
    run:
      config: Debug
